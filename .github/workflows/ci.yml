name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A pull request run cancels the one it replaces. Each push to main gets a
# group of its own, so a main run is never cancelled or left pending by a
# later push: the Publish workflow needs a finished run for the release commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Each job's timeout is well above its longest recent run, so a hung
  # step fails in minutes rather than holding a runner for six hours.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install

      - name: Check release metadata
        run: bun run check:metadata

      - name: Validate eval fixtures (schema-only, no model calls)
        run: bun run check:evals

      - name: Check relative links in markdown
        run: bun run check:links

      - name: Check known-good eval drafts
        run: bun run eval:selftest

      # The whole suite, once: test:coverage runs it with the same 60s test
      # timeout as `bun run test`, then the coverage gate and check:fallback.
      - name: Run tests with coverage and fallback checks
        run: bun run test:coverage

      # The suite runs one seed; a few more catch validate and the schema
      # drifting apart on values that seed never draws.
      - name: Check validate and the schema agree on more seeds
        run: |
          for seed in 1 2 3 4 5; do
            STORY_PROPERTY_SEED=$seed bun test test/validate-schema-property.test.js || exit 1
          done

      - name: Validate examples
        run: bun run test:examples

      - name: Check bundled fallback under Node
        run: node skills/story-maintenance/scripts/story.js --help

  # The full suite on macOS, so path separators, line endings, and
  # file-system differences are caught before a release. Windows is
  # test-windows: the same suite there is dominated by NTFS and Defender, so
  # it runs in parallel shards instead of one long job.
  test-os:
    name: Tests ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # macOS usually finishes in a few minutes. The timeout stays at the
    # previous shared job's limit, well above a slow run.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install

      # `bun run test` gives every test 60s rather than Bun's 5s default, since
      # file-system calls are several times slower on these runners.
      - name: Run tests
        run: bun run test

      # Pack, install, and run the tarball here too, as the node job does.
      - name: Install and run the packed tarball
        timeout-minutes: 10
        run: bun run check:package

  # Every test/*.test.js file runs on exactly one shard. `bun test --shard`
  # builds the lists when the job starts, and scripts/test-shards.js writes the
  # timings that balance them. test/check-scripts.test.js fails if this matrix
  # drops a shard index, and test/test-shards.test.js fails if bun's shards
  # leave a file out or repeat one. Shard 1 also packs the tarball, once, the
  # way the single Windows job did.
  test-windows:
    name: Tests windows-latest (${{ matrix.shard }}/${{ matrix.shards }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        shards: [4]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install

      # Temporary story projects are the slow part on NTFS with Defender
      # scanning each new file. A ReFS Dev Drive skips that scanning; if the
      # runner cannot create one, the normal temp folder is used and Defender
      # is asked to ignore the workspace and temp paths anyway.
      - name: Use a Dev Drive for temporary files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $devTmp = $null
          # Cap the setup. A Dev Drive that hangs would spend the shard's
          # timeout before any test ran; the suite still runs on the normal temp folder.
          $setup = {
            $ErrorActionPreference = 'Stop'
            Import-Module Hyper-V
            $vhd = Join-Path $env:RUNNER_TEMP 'story-devdrive.vhdx'
            $volume = New-VHD -Path $vhd -SizeBytes 50GB -Dynamic |
              Mount-VHD -Passthru |
              Initialize-Disk -Passthru |
              New-Partition -AssignDriveLetter -UseMaximumSize |
              Format-Volume -FileSystem ReFS -DevDrive -Force -Confirm:$false
            if (-not $volume.DriveLetter) { throw 'Format-Volume did not return a drive letter' }
            $tmp = "$($volume.DriveLetter):\story-tmp"
            $null = New-Item -ItemType Directory -Force -Path $tmp
            $tmp
          }
          $job = Start-Job -ScriptBlock $setup
          if (-not (Wait-Job $job -Timeout 90)) {
            Stop-Job $job
            Write-Host "::warning::Dev Drive setup exceeded 90 seconds. Tests will use the normal temp folder."
          } elseif ($job.State -eq 'Completed') {
            $devTmp = "$(Receive-Job $job | Select-Object -Last 1)"
            if ($devTmp -match '^[A-Z]:\\story-tmp$') {
              Write-Host "Dev Drive temp is $devTmp"
            } else {
              Write-Host "::warning::Dev Drive setup returned '$devTmp'. Tests will use the normal temp folder."
              $devTmp = $null
            }
          } else {
            Receive-Job $job -ErrorAction Continue | Out-Host
            Write-Host "::warning::Dev Drive was not created. Tests will use the normal temp folder."
            $devTmp = $null
          }
          Remove-Job $job -Force -ErrorAction SilentlyContinue
          if ($devTmp) {
            Add-Content -Path $env:GITHUB_ENV -Value "TEMP=$devTmp"
            Add-Content -Path $env:GITHUB_ENV -Value "TMP=$devTmp"
            Add-Content -Path $env:GITHUB_ENV -Value "TMPDIR=$devTmp"
          }
          $exclude = @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, $env:TEMP)
          if ($devTmp) { $exclude += $devTmp }
          foreach ($path in ($exclude | Where-Object { $_ } | Select-Object -Unique)) {
            Add-MpPreference -ExclusionPath $path -ErrorAction SilentlyContinue
            Write-Host "Defender exclusion: $path"
          }
          foreach ($processName in @('bun.exe', 'node.exe')) {
            Add-MpPreference -ExclusionProcess $processName -ErrorAction SilentlyContinue
          }
          try {
            Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction Stop
            Write-Host "Defender real-time monitoring is off"
          } catch {
            Write-Host "::warning::Defender real-time monitoring stayed on: $($_.Exception.Message)"
          }
          $pref = Get-MpPreference -ErrorAction SilentlyContinue
          if ($pref) {
            Write-Host "DisableRealtimeMonitoring=$($pref.DisableRealtimeMonitoring)"
          }

      # The same 60s per-test timeout as `bun run test`. `--shard` is bun's own
      # split of that glob, so every test file is in one shard. Passing the
      # paths ourselves makes bun follow plugins/story-skills and exit ELOOP
      # on Windows. Timings only balance the shards.
      - name: Run tests
        run: |
          set -euo pipefail
          shard="${{ matrix.shard }}"
          shards="${{ matrix.shards }}"
          timings="${RUNNER_TEMP}/windows-timings.json"
          node scripts/test-shards.js --write-timings "$timings"
          bun run test -- --shard="${shard}/${shards}" --timings="$timings"

      - name: Install and run the packed tarball
        if: matrix.shard == 1
        timeout-minutes: 10
        run: bun run check:package

  # Keeps the check name `Tests windows-latest` for branch protection. It
  # passes only when every shard did.
  test-windows-done:
    name: Tests windows-latest
    needs: test-windows
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every Windows shard
        run: |
          if [ "${{ needs.test-windows.result }}" != "success" ]; then
            echo "::error::Windows test shards finished with ${{ needs.test-windows.result }}."
            exit 1
          fi

  node:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # package.json declares engines.node >=18; keep the floor covered.
        node: ["18", "20", "22"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Validate examples and schema from source
        run: node scripts/check-examples.js

      - name: Run the source CLI
        run: |
          node bin/story.js --version
          node bin/story.js validate examples/the-last-ember

      - name: Run the bundled fallback
        run: |
          node skills/story-maintenance/scripts/story.js --version
          node skills/story-maintenance/scripts/story.js validate examples/the-last-ember

      # A copied skill runs outside this repo's package.json, so run a copy
      # under a CommonJS package.json the way a copied install would.
      - name: Run a copied fallback outside the repo
        run: |
          install="$RUNNER_TEMP/copied-skill"
          mkdir -p "$install"
          echo '{ "type": "commonjs" }' > "$RUNNER_TEMP/package.json"
          cp -r skills/story-maintenance "$install/"
          node "$install/story-maintenance/scripts/story.js" --version
          node "$install/story-maintenance/scripts/story.js" validate examples/the-last-ember

      # Everything above runs from the checkout. Install the packed tarball the
      # way npm users get it, so a file missing from package.json "files"
      # cannot ship a story bin that crashes on start.
      - name: Install and run the packed tarball
        run: node scripts/check-package.js

  # Builds the standalone binary on each release OS and runs it there, as the
  # publish workflow does for a release.
  binary:
    name: Binary ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-arm64, runner: macos-latest }
          - { target: darwin-x64, runner: macos-15-intel }
          - { target: linux-x64, runner: ubuntu-latest }
          - { target: linux-arm64, runner: ubuntu-24.04-arm }
          - { target: windows-x64, runner: windows-latest }
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Build and smoke-test the binary
        run: bun scripts/build-binaries.js --target "${{ matrix.target }}" --smoke --out dist/binaries

      # A script that skipped its work would still exit 0, so check the
      # archive is there.
      - name: Check the archive was built
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if ! compgen -G "dist/binaries/story-skills_*_${TARGET//-/_}.*" > /dev/null; then
            echo "::error::No archive was built for $TARGET."
            exit 1
          fi
