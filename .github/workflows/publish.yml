name: Publish

# `bun run release` pushes a vX.Y.Z tag, and this workflow publishes that
# version to npm through trusted publishing (OIDC). No npm token is stored;
# npmjs.com trusts this workflow file by name, and provenance is automatic.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, such as v1.2.3
        required: true

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm 11.5.1 or later.
      - name: Update npm
        run: npm install --global npm@11

      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi

      # The release preflight already ran the full checks; this is a smoke test.
      - name: Run both CLIs
        run: |
          node bin/story.js --version
          node skills/story-maintenance/scripts/story.js --help > /dev/null

      - name: Publish to npm
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
            echo "$name@$version is already on npm; nothing to publish."
            exit 0
          fi
          npm publish
