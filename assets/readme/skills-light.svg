<svg xmlns="http://www.w3.org/2000/svg" width="960" height="344" viewBox="0 0 960 344" role="img" aria-labelledby="title desc">
  <title id="title">How the Story Skills fit together</title>
  <desc id="desc">Five stages from left to right. Set up: premise-workshop, story-init. Plan: character-management, worldbuilding, plot-structure, theme-craft, genre-craft, research. Draft: chapter-writing, discovery-drafting, scene-craft, voice-style, verse-craft, interactive-fiction. Revise: revision-continuity, line-editing, reader-panel, feedback-triage, editorial-review. Send it out: submission, publishing, adaptation. series-continuity loops from the last stage back to the first to start the next book, and story-maintenance runs the CLI checks under every stage.</desc>
