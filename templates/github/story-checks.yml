# Story checks - CI for a Story Skills project repository.
#
# Copy this file to .github/workflows/story-checks.yml in the repository that
# holds your story project. Every push and pull request then runs the
# deterministic Story CLI checks, so a chapter PR cannot merge with broken
# registries, dangling references, or continuity contradictions.
#
# If your story project lives in a subdirectory, change STORY_DIR.
#
# The Story CLI is installed once per job from npm, pinned to the
# STORY_VERSION release below; bump STORY_VERSION when you adopt a newer
# story-skills release. Set STORY_PACKAGE to install from a git ref instead.
#
# Actions are pinned to commit SHAs with their moving tags in comments, so a
# compromised tag cannot silently change what this workflow runs. Dependabot
# (github-actions ecosystem) proposes SHA updates.

name: Story checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  STORY_DIR: "."
  STORY_VERSION: "0.23.0"
  # To run the CLI from GitHub instead of npm (an unreleased fix, a fork),
  # uncomment STORY_PACKAGE and point it at a tag, branch, or commit; it
  # replaces story-skills@$STORY_VERSION in the install step.
  # STORY_PACKAGE: "github:danjdewhurst/story-skills#main"

jobs:
  story-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install the Story CLI
        working-directory: ${{ runner.temp }}
        run: |
          npm install --global --prefix "$RUNNER_TEMP/story-cli" "${STORY_PACKAGE:-story-skills@$STORY_VERSION}"
          echo "$RUNNER_TEMP/story-cli/bin" >> "$GITHUB_PATH"

      # story check runs validate, links, and continuity over one scan and
      # reports every finding before failing. Add --strict to fail on
      # warnings too.
      - name: Check structure, references, and continuity
        run: story check "$STORY_DIR"

      - name: Report project health
        run: story report "$STORY_DIR" --actionable
