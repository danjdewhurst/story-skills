# Story checks - CI for a Story Skills project repository.
#
# Copy this file to .github/workflows/story-checks.yml in the repository that
# holds your story project. Every push and pull request then runs the
# deterministic Story CLI checks, so a chapter PR cannot merge with broken
# registries, dangling references, or continuity contradictions.
#
# If your story project lives in a subdirectory, change STORY_DIR.
#
# The Story CLI runs straight from GitHub, pinned to the STORY_REF tag below;
# bump STORY_REF when you adopt a newer story-skills release. To use the
# story-skills package from npm instead, replace each
# github:danjdewhurst/story-skills#... --package value with
# story-skills@<version>.
#
# Actions are pinned to commit SHAs with their moving tags in comments, so a
# compromised tag cannot silently change what this workflow runs. Dependabot
# (github-actions ecosystem) proposes SHA updates.

name: Story checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  STORY_DIR: "."
  STORY_REF: "v0.10.2"

jobs:
  story-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Validate structure, frontmatter, and registries
        run: npx --yes --package "github:danjdewhurst/story-skills#$STORY_REF" story validate "$STORY_DIR"

      - name: Check cross-references and backlinks
        run: npx --yes --package "github:danjdewhurst/story-skills#$STORY_REF" story links "$STORY_DIR"

      - name: Check continuity contracts
        run: npx --yes --package "github:danjdewhurst/story-skills#$STORY_REF" story continuity "$STORY_DIR"

      - name: Report project health
        run: npx --yes --package "github:danjdewhurst/story-skills#$STORY_REF" story report "$STORY_DIR" --actionable
