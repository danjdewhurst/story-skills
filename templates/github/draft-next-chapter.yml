# Draft the next chapter - write a book via pull requests.
#
# Copy this file to .github/workflows/draft-next-chapter.yml in the repository
# that holds your story project. On each run (scheduled or manual), Claude reads
# the story bible, asks the Story CLI for the next deterministic action, drafts
# the next chapter, runs the maintenance checks, and opens a pull request.
# You review the chapter like any other PR; the story-checks workflow keeps
# continuity errors from merging.
#
# Setup:
#   1. Add an ANTHROPIC_API_KEY repository secret.
#   2. Install the Story Skills plugin files so the agent has the workflows:
#      npx skills add danjdewhurst/story-skills  (or commit skills/ to .claude/skills/)
#   3. Adjust STORY_DIR and the cron schedule to taste.
#
# The Story CLI runs straight from GitHub, pinned to the STORY_REF tag below;
# bump STORY_REF when you adopt a newer story-skills release. (There is no
# npm-published package yet; switch the npx --package value to story-skills
# once the package is published to the npm registry.)
#
# Actions are pinned to commit SHAs with their moving tags in comments, so a
# compromised tag cannot silently change what this workflow runs. Dependabot
# (github-actions ecosystem) proposes SHA updates.
#
# Secrets: ANTHROPIC_API_KEY and GITHUB_TOKEN are only passed to steps on
# trusted pushes here. This workflow runs on `schedule` and manual
# `workflow_dispatch` only — never on `pull_request` or `pull_request_target`
# — so fork PRs cannot exfiltrate the secrets, and the agent's shell access is
# limited to the allowlisted story/git/gh commands below.
#
# GitHub does not start other workflows for pull requests opened with the
# built-in GITHUB_TOKEN, so story-checks.yml will not run on the drafted PR by
# itself. This workflow therefore runs the same checks on the drafted branch
# after the agent finishes. To have story-checks.yml run on the PR as well,
# pass a personal access token or GitHub App token as github_token below.
#
# See https://github.com/anthropics/claude-code-action for action options.

name: Draft the next chapter

on:
  schedule:
    - cron: "0 6 * * 1-5" # weekday mornings
  workflow_dispatch:

env:
  STORY_DIR: "."
  STORY_REF: "v0.5.0"

jobs:
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Draft the next chapter
        uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            You are drafting the next chapter of the story project in $STORY_DIR.
            Work on a new branch named draft/chapter-<next-number>.

            1. Run `npx --yes --package "github:danjdewhurst/story-skills#$STORY_REF" story next "$STORY_DIR"` and
               read story.md, chapters/_index.md, continuity/state.md, open
               questions, promises, and the active arc files.
            2. If the next actions report any P0 maintenance issues, fix those
               first and stop after opening a maintenance PR.
            3. Otherwise draft the next chapter following the chapter-writing
               skill: outline first, then prose under "## Chapter Text", with
               accurate frontmatter (pov, status, word-count, locations, characters, mentions, arcs-advanced).
               Add matching scene records and update continuity/state.md,
               promises, questions, and the timeline.
            4. Run the maintenance commands and make them pass:
               npx --yes --package "github:danjdewhurst/story-skills#$STORY_REF" story wordcount "$STORY_DIR" --write
               npx --yes --package "github:danjdewhurst/story-skills#$STORY_REF" story reindex "$STORY_DIR"
               npx --yes --package "github:danjdewhurst/story-skills#$STORY_REF" story validate "$STORY_DIR"
               npx --yes --package "github:danjdewhurst/story-skills#$STORY_REF" story links "$STORY_DIR"
               npx --yes --package "github:danjdewhurst/story-skills#$STORY_REF" story continuity "$STORY_DIR"
            5. Commit, push the branch, and open a pull request titled
               "Draft chapter <number>: <title>" summarizing the beats, the arcs
               advanced, and any promises planted or paid off.
          claude_args: |
            --allowedTools "Bash(npx --yes --package github:danjdewhurst/story-skills* story *),Bash(git checkout -b:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(gh pr create:*),Read,Write,Edit,Glob,Grep"

      - name: Validate structure, frontmatter, and registries
        run: npx --yes --package "github:danjdewhurst/story-skills#$STORY_REF" story validate "$STORY_DIR"

      - name: Check cross-references and backlinks
        run: npx --yes --package "github:danjdewhurst/story-skills#$STORY_REF" story links "$STORY_DIR"

      - name: Check continuity contracts
        run: npx --yes --package "github:danjdewhurst/story-skills#$STORY_REF" story continuity "$STORY_DIR"
