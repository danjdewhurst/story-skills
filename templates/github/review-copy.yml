# Review copy - publish a readable, citable manuscript for non-technical readers.
#
# Copy this file to .github/workflows/review-copy.yml in the repository that
# holds your story project. Every push to main builds `story build --format
# html` and publishes it to GitHub Pages, so beta readers, critique partners,
# and editors get a link instead of a terminal. Every paragraph carries a
# label such as ch03-p12; readers quote it in their notes, and the matching
# issue form (ISSUE_TEMPLATE/manuscript-note.yml) asks for it. A label is a
# position (chapter and paragraph number in that build), so the next push can
# move it: the review copy prints a build stamp (date and short commit) that
# readers quote too, and the author maps an old label back with the steps in
# the feedback-triage skill.
#
# One-time setup: in the repository's Settings > Pages, set Source to
# "GitHub Actions". Pages sites are public unless your plan supports private
# Pages; if the manuscript must stay private, delete the deploy job and share
# the review-copy workflow artifact instead.
#
# If your story project lives in a subdirectory, change STORY_DIR.
#
# A project with no chapters yet has nothing to publish, so the build and
# deploy steps are skipped (and the run passes) until the first chapter exists.
#
# The html build format ships in the first story-skills release after 0.8.2,
# and build --stamp in the first release after 0.12.0; STORY_REF must point
# at that release or later.
#
# The Story CLI runs straight from GitHub, pinned to the STORY_REF tag below;
# bump STORY_REF when you adopt a newer story-skills release.
#
# Actions are pinned to commit SHAs with their moving tags in comments, so a
# compromised tag cannot silently change what this workflow runs. Dependabot
# (github-actions ecosystem) proposes SHA updates.

name: Review copy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Let a running Pages deployment finish rather than cancel it mid-upload.
concurrency:
  group: review-copy
  cancel-in-progress: false

env:
  STORY_DIR: "."
  STORY_REF: "v0.12.0"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      has-chapters: ${{ steps.chapters.outputs.has-chapters }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Check the project before publishing it
        run: |
          npx --yes --package "github:danjdewhurst/story-skills#$STORY_REF" story validate "$STORY_DIR"
          npx --yes --package "github:danjdewhurst/story-skills#$STORY_REF" story links "$STORY_DIR"
          npx --yes --package "github:danjdewhurst/story-skills#$STORY_REF" story continuity "$STORY_DIR"

      # story build exits 1 with "No chapters found to export" on a project
      # that has no chapters yet, such as one fresh from story init.
      - name: Look for chapters
        id: chapters
        run: |
          if [ -n "$(find "$STORY_DIR/chapters" -maxdepth 1 -type f -name '*.md' ! -name '_index.md' ! -name '.*' 2>/dev/null)" ]; then
            echo "has-chapters=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-chapters=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No chapters yet, so there is no review copy to build or publish."
          fi

      - name: Build the review copy
        if: steps.chapters.outputs.has-chapters == 'true'
        run: |
          mkdir -p review-site
          npx --yes --package "github:danjdewhurst/story-skills#$STORY_REF" story build "$STORY_DIR" --format html --stamp "$(date -u +%Y-%m-%d) ${GITHUB_SHA::7}" --out "$GITHUB_WORKSPACE/review-site/index.html"

      - name: Keep the review copy as a workflow artifact
        if: steps.chapters.outputs.has-chapters == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: review-copy
          path: review-site/index.html

      - name: Upload the Pages site
        if: steps.chapters.outputs.has-chapters == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: review-site

  deploy:
    needs: build
    if: needs.build.outputs.has-chapters == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
